<!-- templates/register.html -->
{% extends 'base.html' %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-6 py-12">
    <div class="w-full max-w-md bg-white p-8 md:p-10 rounded-3xl border border-gray-100 shadow-xl space-y-8 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-[var(--color-gold)] to-[var(--color-oceanic-teal)]"></div>
        <div class="text-center space-y-2">
            <h2 class="text-3xl font-display text-[var(--color-abyssal)]">Register</h2>
            <p class="text-xs text-gray-400 font-serif">Create your sacred account to begin logging milestones</p>
        </div>

        <form method="POST" class="space-y-5">
            <div class="space-y-1">
                <label class="block text-[10px] font-display uppercase tracking-widest text-gray-400">Name</label>
                <input type="text" name="username" required class="w-full p-3 rounded-xl border border-gray-200 focus:outline-none focus:border-[var(--color-gold)] text-sm font-sans">
            </div>

            <div class="space-y-1">
                <label class="block text-[10px] font-display uppercase tracking-widest text-gray-400">Email Address</label>
                <input type="email" name="email" required class="w-full p-3 rounded-xl border border-gray-200 focus:outline-none focus:border-[var(--color-gold)] text-sm font-sans">
            </div>

            <div class="space-y-1">
                <label class="block text-[10px] font-display uppercase tracking-widest text-gray-400">Password</label>
                <input type="password" name="password" required class="w-full p-3 rounded-xl border border-gray-200 focus:outline-none focus:border-[var(--color-gold)] text-sm font-sans">
            </div>

            <button type="submit" class="btn-gold w-full py-3.5 rounded-xl text-xs">Create Account</button>
        </form>

        <div class="text-center">
            <p class="text-xs text-gray-500 font-serif">Already registered? <a href="/login" class="text-[var(--color-gold)] hover:underline font-semibold font-sans">Log In</a></p>
        </div>
    </div>
</div>
{% endblock %}
